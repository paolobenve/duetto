# fail2ban filter: refusals at Duetto's door.
# The signalling server writes one line per phone turned away at the
# door, with its address as the reverse proxy passed it on. The journal
# puts "host node[pid]: " before the message: __prefix_line eats it.
# Goes in /etc/fail2ban/filter.d/duetto-door.conf.
[INCLUDES]
before = common.conf

[Definition]
journalmatch = _SYSTEMD_UNIT=duetto-signaling.service
failregex = ^%(__prefix_line)s\[duetto\] turned away: \S+ from <HOST>$
ignoreregex =
