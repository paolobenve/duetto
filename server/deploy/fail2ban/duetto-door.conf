# fail2ban filter: refusals at Duetto's door.
# The signalling server writes one line per phone turned away at the
# door, with its address as the reverse proxy passed it on.
# Goes in /etc/fail2ban/filter.d/duetto-door.conf.
[Definition]
journalmatch = _SYSTEMD_UNIT=duetto-signaling.service
failregex = ^\[duetto\] turned away: \S+ from <HOST>$
ignoreregex =
