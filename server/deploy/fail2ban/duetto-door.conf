# fail2ban filter: refusals at Duetto's door.
# The signalling server writes one line per phone turned away at the
# door, with its address as the reverse proxy passed it on:
#   [duetto] turned away: <12 of the card> from <address>, room <4>…, app <version>
# The journal puts "host node[pid]: " before the message: __prefix_line
# eats it. The filter wanted the address at the end of the line: when the
# room and the app came after it, on 6 October 2026, it stopped finding
# anything, and for three weeks nobody was banned. The door test now
# reads this file against the line the server writes.
# Held by ", room": the twelve characters of the card are the client's
# own writing, and a "from" put in them names nobody.
# Goes in /etc/fail2ban/filter.d/duetto-door.conf.
[INCLUDES]
before = common.conf

[Definition]
journalmatch = _SYSTEMD_UNIT=duetto-signaling.service
failregex = ^%(__prefix_line)s\[duetto\] turned away: .{1,12} from <HOST>, room
ignoreregex =
