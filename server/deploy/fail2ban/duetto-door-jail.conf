# fail2ban jail: whoever keeps getting turned away at Duetto's door is
# kept out at the firewall for a while. The app itself stops knocking
# after one refusal, so thirty in ten minutes is somebody trying codes.
# Mind that an address is often a whole household: a phone of an old
# version, retrying, would ban the family with it.
# Goes in /etc/fail2ban/jail.d/duetto-door.conf.
[duetto-door]
enabled = true
backend = systemd
filter = duetto-door
maxretry = 30
findtime = 10m
bantime = 1h
