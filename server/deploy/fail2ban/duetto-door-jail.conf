# fail2ban jail: whoever keeps getting turned away at Duetto's door is
# kept out at the firewall for a while. The app itself stops knocking
# after one refusal, so sixty in ten minutes is somebody trying codes.
# Mind that an address is often a whole household: a phone of an old
# version, retrying, bans the family with it - it happened, with a
# build that knocked again every twenty seconds after a refusal, and
# the ban took the pages with it. Sixty and twenty minutes: enough to
# blunt a guesser, short enough that a household gets its evening back.
# Goes in /etc/fail2ban/jail.d/duetto-door.conf.
[duetto-door]
enabled = true
backend = systemd
filter = duetto-door
maxretry = 60
findtime = 10m
bantime = 20m
