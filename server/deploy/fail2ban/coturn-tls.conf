# fail2ban filter: TLS handshakes at the relay that never became a session.
# A phone of ours makes the TLS handshake on 5349 and then authenticates;
# a scanner makes the handshake and goes away, and coturn closes the
# session with no user and a socket error. The STUN traffic on 3478 -
# thousands of sessions with no user, closed as "stale" - is the phones
# finding their own address, and is NOT matched here.
# Needs "verbose" in turnserver.conf: the closing line is written then.
# Goes in /etc/fail2ban/filter.d/coturn-tls.conf.
[INCLUDES]
before = common.conf

[Definition]
failregex = ^%(__prefix_line)s.*closed \(2nd stage\), user <> realm <[^>]*> origin <[^>]*>, local \S+:5349, remote <HOST>:\d+, reason: TLS/TCP socket buffer operation error
ignoreregex =
