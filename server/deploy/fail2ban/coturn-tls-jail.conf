# fail2ban jail: three empty handshakes at the relay in ten minutes, and
# the address is out for a day. A phone of ours never makes one, so the
# margin is real; a scanner makes dozens in seconds.
# Goes in /etc/fail2ban/jail.d/coturn-tls.conf.
[coturn-tls]
enabled = true
logpath = /var/log/coturn/turnserver.log
filter = coturn-tls
maxretry = 3
findtime = 10m
bantime = 1d
