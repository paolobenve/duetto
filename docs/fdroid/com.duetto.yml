Builds:
  - versionName: 0.9.9
    versionCode: 275
    commit: v0.9.9
    subdir: app/android/app
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
      - curl -Lo node.tar.gz https://nodejs.org/dist/v20.19.4/node-v20.19.4-linux-x64.tar.gz
      - echo "d80a33707605ced9a31b8f543cea9ab512bc3d2fef2c148f31a50e939ff07560  node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    init:
      - cd ../..
      - npm ci --no-audit --no-fund
    gradle:
      - yes
    scanignore:
      - app/node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - app/node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - app/node_modules/react-native-get-random-values/android/build.gradle
      - app/node_modules/react-native-svg/android/build.gradle
      - app/node_modules/react-native/ReactAndroid/publish.gradle
    scandelete:
      - app/node_modules

